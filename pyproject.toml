[project]
name = "disputedesk"
version = "0.1.0"
description = "Dispute Desk: fraud-reason-code chargeback triage agent (Razorpay AI Buildathon, Track 02)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "lightgbm>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disputedesk", "eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` as an argument default is the framework's own
# idiom (the call is cheap and intentionally re-resolved per request), not
# the mutable-default-argument bug B008 exists to catch.
"disputedesk/api/webhook.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
