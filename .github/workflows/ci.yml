name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Demo reproducibility (Segment A)
        run: |
          set +e
          python -m disputedesk.cli.demo --deterministic-only > /tmp/demo_run1.txt
          status1=$?
          python -m disputedesk.cli.demo --deterministic-only > /tmp/demo_run2.txt
          status2=$?
          set -e

          if [ "$status1" -ne 0 ] || [ "$status2" -ne 0 ]; then
            echo "demo exited non-zero: run1=$status1 run2=$status2" >&2
            exit 1
          fi

          if [ ! -s /tmp/demo_run1.txt ] || [ ! -s /tmp/demo_run2.txt ]; then
            echo "demo produced empty output" >&2
            exit 1
          fi

          diff /tmp/demo_run1.txt /tmp/demo_run2.txt
